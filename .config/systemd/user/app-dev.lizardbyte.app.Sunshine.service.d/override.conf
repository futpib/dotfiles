# Run Sunshine through sunshine-launch, which decides per machine whether to
# keep an NVIDIA card asleep and whether streams get a KWin virtual screen.
# Enabling the service stays a per-machine choice:
#   systemctl --user enable --now app-dev.lizardbyte.app.Sunshine.service
[Service]
ExecStart=
ExecStart=%h/.local/bin/sunshine-launch
SyslogIdentifier=sunshine
