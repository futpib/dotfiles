# Begin cleanup below 5% available; stop at 8% to avoid frequent retriggering.
# Values accept percentages, GiB, or MiB. This file is read by the user service.
# Unsuccessful or interrupted attempts can retry at the next five-minute check.
# The service caps CPU usage at one core, permits 65,536 open lock files, and
# allows up to 30 minutes per attempt. CPU and I/O scheduling stay low priority.
CACHE_CLEAN_LOW_WATERMARK=5%
CACHE_CLEAN_HIGH_WATERMARK=8%
