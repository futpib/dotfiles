# Begin cleanup below 5% available; stop at 8% to avoid frequent retriggering.
# Values accept percentages, GiB, or MiB. This file is read by the user service.
# Unsuccessful or interrupted cleanup attempts back off for six hours; the
# service caps CPU usage at 20% of one core and each attempt at five minutes.
CACHE_CLEAN_LOW_WATERMARK=5%
CACHE_CLEAN_HIGH_WATERMARK=8%
